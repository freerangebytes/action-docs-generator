---
name: Versioning

on:
    push:
        branches:
            - main

concurrency:
    group: versioning
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    calculate-version:
        name: Calculate Version
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            current: ${{ steps.version.outputs.current }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Install svu
              uses: freerangebytes/setup-svu@3dcc2ead4b6be1287f9bfe2ac4764a826c110a4f  # v0.2.1

            - name: Calculate next version
              id: version
              run: |
                  CURRENT=$(svu current || echo "v0.0.0")

                  # `--v0` caps a breaking change at a minor bump while the
                  # current version is still v0, so `feat!:` gives v0.x.0
                  # rather than jumping to v1.0.0. It is a no-op from v1.0.0
                  # onward, where breaking changes bump major as usual.
                  NEXT=$(svu next --v0)

                  echo "Current: $CURRENT"
                  echo "Next: $NEXT"
                  echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
                  echo "version=$NEXT" >> "$GITHUB_OUTPUT"

    tag:
        name: Create Tag and Release
        runs-on: ubuntu-latest
        needs: [calculate-version]
        if: needs.calculate-version.outputs.version != needs.calculate-version.outputs.current
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  persist-credentials: false

            - name: Create Tag and Release
              id: release
              uses: freerangebytes/auto-tag-and-release@723446276a78277e0971bad96fc7f141c5290df4  # v0.3.1
              with:
                  version: ${{ needs.calculate-version.outputs.version }}
                  previous-version: ${{ needs.calculate-version.outputs.current }}
                  ref: ${{ github.sha }}
