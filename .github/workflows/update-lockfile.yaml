---
name: Chore - Update lockfile

on:
  pull_request:

permissions: {}

concurrency:
  group: chore-update_lockfile-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  update-lockfile:
    name: Update lockfile
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10

      - name: Install dependencies
        run: pnpm install --lockfile-only

      - name: Upload generated artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: updated_lockfile
          path: |
            pnpm-lock.yaml
          retention-days: 1
          if-no-files-found: error

  # `pull_request` withholds secrets from fork runs, so the App token cannot be
  # minted there and pushing to a fork's branch would fail regardless. Skipping
  # keeps fork pull requests green while the job above still validates them.
  commit:
    name: Commit lockfile
    runs-on: ubuntu-latest
    needs: update-lockfile
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.HENRIETTA_APP_ID }}
          private-key: ${{ secrets.HENRIETTA_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Download generated artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: updated_lockfile

      - name: Commit and push changes
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git add pnpm-lock.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "henrietta-the-hen[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "chore: update lockfile"
          git push
