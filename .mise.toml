[tools]
# Linters are pinned so they behave the same on every machine and in CI.
actionlint = '1.7'
yamllint = '1.37'
node = '24'
pnpm = '10'

[settings]
experimental = true

# yamllint installs through mise's pipx backend. mise applies a release-age
# cooldown by passing pip `--uploaded-prior-to`, but formats the timestamp with
# nanosecond precision, which pip refuses to parse, so the install always fails.
# The cooldown buys nothing as the version above is pinned, so it can
# never resolve to a freshly published release. Everything else keeps it.
minimum_release_age_excludes = ['yamllint']

[tasks.docs]
description = "Generate README.md from action.yaml"
run = """
pnpm build && pnpm package
env GITHUB_REPOSITORY="freerangebytes/action-docs-generator" \
    GITHUB_STEP_SUMMARY="/dev/null" \
    'INPUT_DESCRIPTION-PATH'="./.docs/DESCRIPTION.md" \
    'INPUT_EXAMPLES-PATH'="./.docs/examples.yaml" \
    'INPUT_ACTION-PATH'="action.yaml" \
    'INPUT_OUTPUT-PATH'="README.md" \
    'INPUT_LICENSE'="MIT" \
    'INPUT_LICENSE-PATH'="LICENSE" \
    'INPUT_PERMISSIONS'='{"contents": "read"}' \
    'INPUT_HEADER-LEVEL'="1" \
    node action/index.js
"""

[tasks."lint:code"]
description = "Lint TypeScript source code with ESLint"
run = "pnpm lint"

[tasks."lint:workflows"]
description = "Lint GitHub Actions workflow files with actionlint"
run = """
echo "Running actionlint..."
actionlint .github/workflows/*.yaml
"""

[tasks.lint]
description = "Run all linters"
depends = ["lint:code", "lint:workflows", "lint:yamllint"]

[tasks."lint:yamllint"]
description = "Lint with yamllint"
run = """
echo "Running yamllint..."
yamllint .
"""

[tasks.typecheck]
description = "Type check TypeScript source code"
run = "pnpm typecheck"

[tasks.check]
description = "Run all checks (linting and type checking)"
depends = ["lint", "typecheck"]

[tasks."test:e2e"]
description = "Run e2e test workflow locally using act"
run = "act pull_request -W .github/workflows/test.yaml --container-architecture linux/amd64 -P ubuntu-latest=catthehacker/ubuntu:act-latest"

[tasks."test:e2e:job"]
description = "Run a specific e2e test job locally (usage: mise run test:e2e:job JOB_NAME)"
run = "act pull_request -W .github/workflows/test.yaml --container-architecture linux/amd64 -P ubuntu-latest=catthehacker/ubuntu:act-latest -j {{arg(name='job')}}"

[tasks."test:unit"]
description = "Run unit tests"
run = "pnpm test"

[tasks.test]
description = "Run all tests"
depends = ["test:unit", "test:e2e"]

[env]
_.path = ['{{config_root}}/node_modules/.bin']
